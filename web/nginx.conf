server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /catalog-api/ {
        proxy_pass http://catalog-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /orders-api/ {
        proxy_pass http://order-api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
